name: Syncore Audit Worker
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      test_telegram_alert:
        description: 'Envoyer une alerte Telegram simulee (sans modifier Supabase)'
        required: false
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: syncore-audit-worker
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: browser-actions/setup-chrome@v1
      - run: npm ci
      - run: npm install --no-save lighthouse@12
      - name: Schedule active sites (once per UTC day)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/schedule-sites.mjs
      - name: Process one audit
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PERFORMANCE_ALERT_DROP_POINTS: "15"
        run: node scripts/audit-worker.mjs
      - name: Test simulated Telegram performance alert
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_telegram_alert == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PERFORMANCE_ALERT_DROP_POINTS: "15"
        run: node scripts/test-telegram-alert.mjs
